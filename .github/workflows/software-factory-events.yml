name: Report product workflow and deployment events

on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize, closed, ready_for_review]
  workflow_run:
    workflows: [CI]
    branches: [dev, main]
    types: [requested, in_progress, completed]
  deployment_status:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/github-script@v7
        env:
          PORTAL_OIDC_AUDIENCE: software.goodmorning.mx
        with:
          script: |
            if (context.repo.owner.toLowerCase() === 'goodmorning-mx'
              && ['goodmorning-mvp-template', 'software'].includes(context.repo.repo)) {
              core.info('This repository is platform infrastructure, not a managed product; skipping portal events.');
              return;
            }
            const event = context.eventName;
            const payload = context.payload;
            const action = String(payload.action || '');
            let stage = 'requested';
            let status = 'unknown';
            let title = 'GitHub actualizó el producto';
            let sourceSha = context.sha;
            let environment;
            let deploymentId;
            let pullRequestNumber;
            let workflowRunId;
            let sourceBranch;
            let sourceEvent;
            let sourceWorkflowName;
            let url;

            if (event === 'pull_request') {
              const pr = payload.pull_request || {};
              stage = 'pull_request';
              status = action === 'closed'
                ? (pr.merged ? 'success' : 'cancelled')
                : 'in_progress';
              title = action === 'closed'
                ? (pr.merged ? 'Pull request integrado' : 'Pull request cerrado')
                : 'Pull request actualizado';
              sourceSha = (pr.merged && pr.merge_commit_sha) || pr.head?.sha || context.sha;
              pullRequestNumber = pr.number || payload.number;
              url = pr.html_url;
            } else if (event === 'workflow_run') {
              const run = payload.workflow_run || {};
              stage = 'checks';
              status = run.status === 'completed'
                ? (run.conclusion === 'success' ? 'success' : run.conclusion === 'cancelled' ? 'cancelled' : 'failure')
                : run.status === 'in_progress' ? 'in_progress' : 'queued';
              title = `CI ${run.name || 'workflow'} ${status === 'success' ? 'pasó' : status === 'failure' ? 'falló' : 'actualizado'}`;
              sourceSha = run.head_sha || context.sha;
              pullRequestNumber = run.pull_requests?.[0]?.number;
              workflowRunId = run.id;
              sourceBranch = run.head_branch;
              sourceEvent = run.event;
              sourceWorkflowName = run.name;
              url = run.html_url;
            } else if (event === 'deployment_status') {
              const deployment = payload.deployment || {};
              const deploymentStatus = payload.deployment_status || {};
              const state = deploymentStatus.state;
              stage = state === 'success' ? 'verification' : 'deployment';
              status = state === 'success' ? 'success'
                : ['failure', 'error'].includes(state) ? 'failure'
                : state === 'inactive' ? 'cancelled'
                : state === 'in_progress' ? 'in_progress' : 'queued';
              title = `Despliegue ${deployment.environment || 'actualizado'}: ${status}`;
              sourceSha = deployment.sha || context.sha;
              environment = ['dev', 'production'].includes(deployment.environment)
                ? deployment.environment : undefined;
              deploymentId = String(deployment.id || '');
              url = deploymentStatus.environment_url || deploymentStatus.target_url;
            } else if (event === 'push') {
              stage = 'checks';
              status = 'queued';
              title = 'Nuevo commit recibido';
              sourceSha = payload.after || context.sha;
            }

            const token = await core.getIDToken(process.env.PORTAL_OIDC_AUDIENCE);
            core.setSecret(token);
            const body = {
              event_id: `${context.repo.repo}:${context.runId}:${event}:${action}:${status}`,
              event_type: event,
              product_slug: context.repo.repo,
              stage,
              status,
              title: title.slice(0, 180),
              summary: 'GitHub actualizó una etapa rastreable de este producto.',
              source_sha: /^[0-9a-f]{7,64}$/.test(sourceSha || '') ? sourceSha : undefined,
              environment,
              deployment_id: deploymentId || undefined,
              url: typeof url === 'string' && url.startsWith('https://') ? url.slice(0, 512) : undefined,
              pull_request_number: Number.isInteger(pullRequestNumber) ? pullRequestNumber : undefined,
              workflow_run_id: Number.isInteger(workflowRunId) ? workflowRunId : undefined,
              source_branch: sourceBranch,
              source_event: sourceEvent,
              source_workflow_name: sourceWorkflowName,
            };
            const portalApis = [
              'https://api.dev.software.goodmorning.mx',
              'https://api.software.goodmorning.mx',
            ];
            let delivered = 0;
            for (const api of portalApis) {
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                try {
                  const response = await fetch(`${api}/internal/products/events`, {
                    method: 'POST',
                    headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
                    body: JSON.stringify(body),
                    signal: AbortSignal.timeout(8000),
                  });
                  if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                  }
                  const result = await response.json();
                  if (result.matched || result.duplicate) delivered += 1;
                  break;
                } catch (error) {
                  if (attempt === 3) {
                    core.warning(`Could not report this event to ${api} after three attempts.`);
                  } else {
                    await new Promise(resolve => setTimeout(resolve, attempt * 1000));
                  }
                }
              }
            }
            if (delivered === 0) {
              throw new Error('No Software portal recorded this product event.');
            }

            if (event === 'push' && context.ref === 'refs/heads/dev') {
              const environment = 'dev';
              const product = context.repo.repo;
              const api = `https://api.dev.${product}.goodmorning.mx`;
              const frontend = `https://dev.${product}.goodmorning.mx`;
              let observedApi = '';
              let observedFrontend = '';
              let verified = false;
              for (let attempt = 1; attempt <= 36; attempt += 1) {
                try {
                  const [apiResponse, frontendResponse] = await Promise.all([
                    fetch(`${api}/version`, { signal: AbortSignal.timeout(8000) }),
                    fetch(`${frontend}/version.json`, { signal: AbortSignal.timeout(8000) }),
                  ]);
                  if (apiResponse.ok) observedApi = (await apiResponse.json().catch(() => ({}))).commit_sha || '';
                  if (frontendResponse.ok) observedFrontend = (await frontendResponse.json().catch(() => ({}))).commit_sha || '';
                  if (observedFrontend !== sourceSha) {
                    const hybridResponse = await fetch(`${frontend}/app/version.json`, { signal: AbortSignal.timeout(8000) });
                    if (hybridResponse.ok) observedFrontend = (await hybridResponse.json().catch(() => ({}))).commit_sha || observedFrontend;
                  }
                  if (observedApi === sourceSha && observedFrontend === sourceSha) {
                    verified = true;
                    break;
                  }
                } catch {
                  // Coolify may still be building or switching the deployment.
                }
                if (attempt < 36) await new Promise(resolve => setTimeout(resolve, 10000));
              }
              const verificationEvent = {
                ...body,
                event_id: `${context.repo.repo}:${context.runId}:runtime-verification`,
                event_type: 'runtime_verification',
                stage: 'verification',
                status: verified ? 'success' : 'failure',
                title: verified ? `Versión ${environment} confirmada` : `Versión ${environment} sin confirmar`,
                summary: verified
                  ? 'API y frontend reportan exactamente la SHA enviada a la rama.'
                  : 'El API y el frontend no reportaron la SHA esperada antes del tiempo límite.',
                environment,
                desired_sha: sourceSha,
                observed_sha: observedApi === sourceSha && observedFrontend === sourceSha
                  ? sourceSha
                  : observedFrontend || observedApi || undefined,
                url: frontend,
              };
              let verificationDelivered = 0;
              for (const portalApi of portalApis) {
                try {
                  const response = await fetch(`${portalApi}/internal/products/events`, {
                    method: 'POST',
                    headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
                    body: JSON.stringify(verificationEvent),
                    signal: AbortSignal.timeout(8000),
                  });
                  if (response.ok) {
                    const result = await response.json();
                    if (result.matched || result.duplicate) verificationDelivered += 1;
                  }
                } catch {
                  core.warning(`Could not report runtime verification to ${portalApi}.`);
                }
              }
              if (verificationDelivered === 0) {
                throw new Error('No Software portal recorded runtime verification.');
              }
              if (!verified) {
                throw new Error(`Runtime did not confirm source SHA ${sourceSha} for ${environment}.`);
              }
            }
